<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finger Paint Smear</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="toolbar" aria-label="Paint tools">
        <div class="control color-control">
          <label for="paintColor">Color</label>
          <input id="paintColor" type="color" value="#2b70d6" />
        </div>

        <div class="control">
          <label for="brushSize">Size <span id="brushSizeValue">42</span></label>
          <input id="brushSize" type="range" min="12" max="120" value="42" />
        </div>

        <div class="control">
          <label for="smearStrength">Smear <span id="smearValue">62</span></label>
          <input id="smearStrength" type="range" min="0" max="100" value="62" />
        </div>

        <div class="control touch-control">
          <label for="touchType">Touch</label>
          <select id="touchType">
            <option value="finger">Finger</option>
            <option value="bristle">Bristle</option>
          </select>
        </div>

        <div class="actions">
          <button id="clearButton" type="button">Clear</button>
          <button id="saveButton" type="button">Save PNG</button>
        </div>
      </header>

      <section class="canvas-wrap" aria-label="Finger painting canvas">
        <canvas id="paintCanvas"></canvas>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
